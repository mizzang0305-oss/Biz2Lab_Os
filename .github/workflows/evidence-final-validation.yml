name: Production dependency audit

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.number == 123
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
