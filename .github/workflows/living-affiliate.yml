name: Living affiliate publication
on:
  push:
    paths:
      - 'app/living/**'
      - 'components/living/**'
      - 'components/layout/SiteHeader.tsx'
      - 'components/layout/PublicRouteChrome.tsx'
      - 'components/pocket-money/opportunity-list.module.css'
      - 'app/privacy/**'
      - 'app/about/**'
      - 'app/contact/**'
      - 'app/essays/**'
      - 'app/topics/**'
      - 'app/layout.tsx'
      - 'app/page.tsx'
      - 'app/robots.ts'
      - 'app/rss.xml/**'
      - 'components/essays/**'
      - 'content/knowledge-essays/**'
      - 'data/knowledge-*.json'
      - 'lib/essays/**'
      - 'assets/fonts/**'
      - 'public/images/essays/**'
      - 'tests/knowledge-publication.test.ts'
      - 'next.config.ts'
      - 'app/sitemap.ts'
      - 'lib/living-posts.ts'
      - 'tests/living-posts.test.ts'
      - 'tests/public-disclosure-navigation.test.ts'
      - 'tests/pocket-money-retirement.test.ts'
      - '.github/workflows/living-affiliate.yml'
  pull_request:
    paths:
      - 'app/living/**'
      - 'components/living/**'
      - 'components/layout/SiteHeader.tsx'
      - 'components/layout/PublicRouteChrome.tsx'
      - 'components/pocket-money/opportunity-list.module.css'
      - 'app/privacy/**'
      - 'app/about/**'
      - 'app/contact/**'
      - 'app/essays/**'
      - 'app/topics/**'
      - 'app/layout.tsx'
      - 'app/page.tsx'
      - 'app/robots.ts'
      - 'app/rss.xml/**'
      - 'components/essays/**'
      - 'content/knowledge-essays/**'
      - 'data/knowledge-*.json'
      - 'lib/essays/**'
      - 'assets/fonts/**'
      - 'public/images/essays/**'
      - 'tests/knowledge-publication.test.ts'
      - 'next.config.ts'
      - 'app/sitemap.ts'
      - 'lib/living-posts.ts'
      - 'tests/living-posts.test.ts'
      - 'tests/public-disclosure-navigation.test.ts'
      - 'tests/pocket-money-retirement.test.ts'
      - '.github/workflows/living-affiliate.yml'
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/tsx/dist/cli.mjs --test tests/knowledge-publication.test.ts tests/living-posts.test.ts tests/public-disclosure-navigation.test.ts tests/pocket-money-retirement.test.ts
      - run: node node_modules/eslint/bin/eslint.js app/living app/about app/contact app/privacy app/essays app/topics app/layout.tsx app/page.tsx app/robots.ts app/rss.xml app/sitemap.ts components/essays components/living components/layout/SiteHeader.tsx components/layout/PublicRouteChrome.tsx lib/essays lib/living-posts.ts next.config.ts tests/knowledge-publication.test.ts tests/living-posts.test.ts tests/public-disclosure-navigation.test.ts tests/pocket-money-retirement.test.ts --max-warnings=0
      - run: npm run typecheck
      - run: npm run build
