name: Living affiliate publication
on:
  push:
    paths:
      - 'app/living/**'
      - 'components/living/**'
      - 'components/layout/SiteHeader.tsx'
      - 'components/layout/PublicRouteChrome.tsx'
      - 'components/pocket-money/opportunity-list.module.css'
      - 'app/privacy/**'
      - 'app/sitemap.ts'
      - 'lib/living-posts.ts'
      - 'tests/living-posts.test.ts'
      - 'tests/public-disclosure-navigation.test.ts'
      - 'tests/pocket-money-retirement.test.ts'
      - '.github/workflows/living-affiliate.yml'
  pull_request:
    paths:
      - 'app/living/**'
      - 'components/living/**'
      - 'components/layout/SiteHeader.tsx'
      - 'components/layout/PublicRouteChrome.tsx'
      - 'components/pocket-money/opportunity-list.module.css'
      - 'app/privacy/**'
      - 'app/sitemap.ts'
      - 'lib/living-posts.ts'
      - 'tests/living-posts.test.ts'
      - 'tests/public-disclosure-navigation.test.ts'
      - 'tests/pocket-money-retirement.test.ts'
      - '.github/workflows/living-affiliate.yml'
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node node_modules/tsx/dist/cli.mjs --test tests/living-posts.test.ts tests/public-disclosure-navigation.test.ts tests/pocket-money-retirement.test.ts
      - run: node node_modules/eslint/bin/eslint.js app/living app/privacy app/sitemap.ts components/living components/layout/SiteHeader.tsx components/layout/PublicRouteChrome.tsx lib/living-posts.ts tests/living-posts.test.ts tests/public-disclosure-navigation.test.ts tests/pocket-money-retirement.test.ts --max-warnings=0
      - run: npm run typecheck
      - run: npm run build
