name: Apply final two evidence approvals

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply-review:
    if: github.event.pull_request.number == 123
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard delegated review scope
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.head.ref }}" = "codex/biz2lab-evidence-first-rebuild-20260728"
          test -f evidence-assets/candidates/ai-business-automation-guide-evidence-01.webp
          test -f evidence-assets/candidates/daily-numbers-for-small-business-evidence-01.webp
          sha256sum evidence-assets/candidates/ai-business-automation-guide-evidence-01.webp | grep '^f1f2bdfe272fbfa054aaeb77905b388fcb232087606ffa090c52e3960772f0fb '
          sha256sum evidence-assets/candidates/daily-numbers-for-small-business-evidence-01.webp | grep '^6ebeaa03f68bd1441e3ad06eacdb9eeb2a4b3fcbf5080fe10a9a61bd455bd6eb '

      - name: Install dependencies
        run: npm ci

      - name: Apply delegated approvals
        shell: bash
        run: |
          set -euo pipefail
          reviewer="owner-delegated-gpt-5.6-thinking-final-two-visual-review"
          npm run evidence:approve -- --id commerce-upload-approval-gate --reviewer "$reviewer" --apply
          npm run evidence:approve -- --id mybiz-readonly-operations-dashboard --reviewer "$reviewer" --apply

      - name: Record final visual review
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("reports/biz2lab-evidence-review-packet-2026-07-29.md")
          text = path.read_text(encoding="utf-8")
          marker = "## 2026-08-01 최종 2개 위임 시각 검수"
          if marker not in text:
              text += r'''

## 2026-08-01 최종 2개 위임 시각 검수

- 검수자: `owner-delegated-gpt-5.6-thinking-final-two-visual-review`
- 위임 근거: 저장소 소유자가 최종 후보 2개의 직접 검수와 안전한 승인 반영을 요청함
- 검수 대상: exact PR 후보 원본 2개와 350px 모바일 가독성
- 검수 방법: 원본 이미지를 직접 확대해 완결성, fixture/local-demo 표시, 실제 식별자, 홍보성 주장, 지원 주장 일치를 확인함
- 자동 OCR 사용: 없음
- Production, AdSense, Search Console 변경: 없음

| evidence ID | 결정 | 최종 판단 |
|---|---|---|
| `commerce-upload-approval-gate` | **APPROVED** | `로컬 데모`, 외부 업로드 비활성화, `can_upload=false`, 완전한 quota 차단 사유와 다음 행동이 하나의 완결된 카드 안에서 읽힘. token·secret·실제 업로드 성과 주장이 없음 |
| `mybiz-readonly-operations-dashboard` | **APPROVED** | `가상 데모 매장`, 읽기 전용·가상 데이터 고지와 고객 기록·예약·웨이팅·QR 주문 분리가 모바일에서 명확함. 기존 홍보 문구와 실제 성과 주장이 제거됨 |

두 항목의 SHA-256은 manifest와 일치했으며 PII/secret scan은 pass입니다. 이 승인으로 콘텐츠 증거 7개가 모두 approved 상태가 됩니다.
'''
              path.write_text(text, encoding="utf-8")
          PY

      - name: Remove temporary workflow
        shell: bash
        run: rm -f .github/workflows/evidence-final-two-review.yml

      - name: Validate approved state
        shell: bash
        run: |
          set -euo pipefail
          npm run evidence:validate
          npm test
          npm run lint
          npm run typecheck
          VERCEL_ENV=production npm run build
          test -f public/images/evidence/ai-business-automation-guide-evidence-01.webp
          test -f public/images/evidence/daily-numbers-for-small-business-evidence-01.webp
          git diff --check

      - name: Commit and push delegated review
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Biz2Lab delegated review"
          git config user.email "mizzang0305@gmail.com"
          git add -A
          git commit -m "review(evidence): approve final two mobile captures" -m "Approve the complete upload-blocker card and non-promotional MyBiz read-only dashboard after delegated visual review. Remove the temporary review workflow. PR remains Draft; Production, AdSense, and Search Console remain untouched."
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
