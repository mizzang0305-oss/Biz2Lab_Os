name: Evidence tree SHA artifact

on:
  pull_request:
    branches:
      - master
    types:
      - synchronize

permissions:
  contents: read

jobs:
  tree:
    if: github.event.pull_request.number == 123
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record exact tree
        run: |
          git rev-parse HEAD > commit.txt
          git rev-parse HEAD^{tree} > tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: biz2lab-tree-${{ github.sha }}
          path: |
            commit.txt
            tree.txt
          retention-days: 1
