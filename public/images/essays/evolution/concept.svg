<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="title description" font-family="Arial, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><title id="title">사다리가 아닌 갈림길</title><desc id="description">공통조상에서 갈라진 가지와 나란한 현재의 가지 끝을 보여 주는 계통 개념도</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6c68" /></marker></defs><rect x="1" y="1" width="638" height="458" fill="#f7f4ed" stroke="#d7d5ca" stroke-width="2" rx="12" /><text x="320" y="45" fill="#8c451e" font-size="28" text-anchor="middle">사다리가 아닌 갈림길</text><line x1="100" y1="330" x2="220" y2="330" stroke="#2d6c68" stroke-width="5" stroke-linecap="round" /><path d="M220 330 V190 H355 V130 H550 M355 190 V230 H550 M220 330 H380 V350 H550" stroke="#2d6c68" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><circle cx="550" cy="130" r="9" fill="#8c451e" stroke="#202b2c" stroke-width="2" /><text x="545" y="178" fill="#202b2c" font-size="26" text-anchor="middle">가지 A</text><circle cx="550" cy="230" r="9" fill="#8c451e" stroke="#202b2c" stroke-width="2" /><text x="545" y="278" fill="#202b2c" font-size="26" text-anchor="middle">가지 B</text><circle cx="550" cy="350" r="9" fill="#8c451e" stroke="#202b2c" stroke-width="2" /><text x="545" y="398" fill="#202b2c" font-size="26" text-anchor="middle">가지 C</text><text x="120" y="394" fill="#202b2c" font-size="25" text-anchor="middle">공통조상</text><text x="320" y="87" fill="#202b2c" font-size="25" text-anchor="middle">시간의 흐름 →</text><line x1="589" y1="103" x2="589" y2="376" stroke="#d7d5ca" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 8" /></svg>