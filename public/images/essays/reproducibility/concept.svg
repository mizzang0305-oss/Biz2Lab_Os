<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="title description" font-family="Arial, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><title id="title">다시 확인하는 세 가지 질문</title><desc id="description">같은 자료와 계산의 재현, 새 자료의 반복, 다른 조건의 일반화를 비교한 그림</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6c68" /></marker></defs><rect x="1" y="1" width="638" height="458" fill="#f7f4ed" stroke="#d7d5ca" stroke-width="2" rx="12" /><text x="320" y="45" fill="#8c451e" font-size="28" text-anchor="middle">다시 확인하는 세 가지 질문</text><rect x="30" y="101" width="275" height="75" fill="#eeece3" stroke="#d7d5ca" stroke-width="2" rx="8" /><text x="167.5" y="148.5" fill="#202b2c" font-size="26" text-anchor="middle">같은 입력·계산</text><line x1="317" y1="139" x2="363" y2="139" stroke="#2d6c68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><rect x="385" y="101" width="225" height="75" fill="#e6ece7" stroke="#d7d5ca" stroke-width="2" rx="8" /><text x="497.5" y="148.5" fill="#202b2c" font-size="28" text-anchor="middle">계산 재현</text><rect x="30" y="210" width="275" height="75" fill="#eeece3" stroke="#d7d5ca" stroke-width="2" rx="8" /><text x="167.5" y="257.5" fill="#202b2c" font-size="26" text-anchor="middle">새 자료·같은 질문</text><line x1="317" y1="248" x2="363" y2="248" stroke="#2d6c68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><rect x="385" y="210" width="225" height="75" fill="#e6ece7" stroke="#d7d5ca" stroke-width="2" rx="8" /><text x="497.5" y="257.5" fill="#202b2c" font-size="28" text-anchor="middle">연구 반복</text><rect x="30" y="319" width="275" height="75" fill="#eeece3" stroke="#d7d5ca" stroke-width="2" rx="8" /><text x="167.5" y="366.5" fill="#202b2c" font-size="26" text-anchor="middle">다른 조건</text><line x1="317" y1="357" x2="363" y2="357" stroke="#2d6c68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><rect x="385" y="319" width="225" height="75" fill="#e6ece7" stroke="#d7d5ca" stroke-width="2" rx="8" /><text x="497.5" y="366.5" fill="#202b2c" font-size="28" text-anchor="middle">일반화</text></svg>