<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="title description" font-family="Arial, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><title id="title">닮은 모습에서 설계의 책임까지</title><desc id="description">외양, 대화, 책임을 서로 다른 세 층으로 그린 개념도</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6c68" /></marker></defs><rect x="1" y="1" width="638" height="458" fill="#f7f4ed" stroke="#d7d5ca" stroke-width="2" rx="12" /><text x="320" y="45" fill="#8c451e" font-size="28" text-anchor="middle">닮은 모습에서 설계의 책임까지</text><rect x="30" y="110" width="170" height="245" fill="#fcfaf5" stroke="#d7d5ca" stroke-width="2" rx="8" /><circle cx="115" cy="185" r="38" fill="#eeece3" stroke="#2d6c68" stroke-width="2" /><circle cx="100" cy="180" r="3" fill="#202b2c" stroke="#202b2c" stroke-width="2" /><circle cx="130" cy="180" r="3" fill="#202b2c" stroke="#202b2c" stroke-width="2" /><path d="M95 200 Q115 216 135 200" stroke="#202b2c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="115" y="275" fill="#202b2c" font-size="32" text-anchor="middle">외양</text><text x="115" y="315" fill="#202b2c" font-size="24" text-anchor="middle">닮아 보임</text><rect x="235" y="110" width="170" height="245" fill="#fcfaf5" stroke="#d7d5ca" stroke-width="2" rx="8" /><circle cx="320" cy="185" r="38" fill="#eeece3" stroke="#2d6c68" stroke-width="2" /><rect x="290" y="167" width="60" height="40" fill="none" stroke="#2d6c68" stroke-width="2" rx="8" /><path d="M315 207 L305 223 L330 207" stroke="#2d6c68" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="320" y="275" fill="#202b2c" font-size="32" text-anchor="middle">대화</text><text x="320" y="315" fill="#202b2c" font-size="24" text-anchor="middle">응답을 받음</text><rect x="440" y="110" width="170" height="245" fill="#fcfaf5" stroke="#d7d5ca" stroke-width="2" rx="8" /><circle cx="525" cy="185" r="38" fill="#eeece3" stroke="#2d6c68" stroke-width="2" /><path d="M500 185 L520 205 L550 165" stroke="#2d6c68" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="525" y="275" fill="#202b2c" font-size="32" text-anchor="middle">책임</text><text x="525" y="315" fill="#202b2c" font-size="24" text-anchor="middle">조건을 정함</text><text x="320" y="410" fill="#202b2c" font-size="25" text-anchor="middle">같아 보이는 것과 맡길 일의 범위를 구분</text></svg>