<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="title desc"><title id="title">네 지역에 닿는 일곱 다리</title><desc id="desc">A와 B 사이 두 다리, A와 C 사이 두 다리, AD·BD·CD 각 한 다리. 차수는 A 5, B 3, C 3, D 3이다.</desc><rect width="640" height="460" fill="#f5f3ec"/><g font-family="Arial, sans-serif" fill="#163330"><text x="32" y="42" font-size="23" font-weight="bold">네 지역에 닿는 일곱 다리</text><text x="32" y="76" font-size="16">AB 두 개 · AC 두 개 · AD, BD, CD 각 한 개</text><g stroke="#167467" stroke-width="4" fill="none"><path d="M320 225 Q210 60 125 145"/><path d="M320 225 Q200 215 125 145"/><path d="M320 225 Q195 235 125 335"/><path d="M320 225 Q240 395 125 335"/><path d="M320 225 L535 225"/><path d="M125 145 Q380 80 535 225"/><path d="M125 335 Q380 390 535 225"/></g><g text-anchor="middle" font-size="22" fill="white"><circle cx="320" cy="225" r="42" fill="#163330"/><circle cx="125" cy="145" r="39" fill="#163330"/><circle cx="125" cy="335" r="39" fill="#163330"/><circle cx="535" cy="225" r="39" fill="#163330"/><text x="320" y="233">A · 5</text><text x="125" y="153">B · 3</text><text x="125" y="343">C · 3</text><text x="535" y="233">D · 3</text></g><text x="32" y="425" font-size="17">홀수 차수 네 곳 · 출발과 도착 두 곳으로 부족</text></g></svg>