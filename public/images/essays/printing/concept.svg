<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="title description" font-family="Arial, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><title id="title">같은 판에서 여러 부가 나온다</title><desc id="description">한 인쇄판의 같은 글자 배열이 세 장의 종이에 반복되는 개념도</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6c68" /></marker></defs><rect x="1" y="1" width="638" height="458" fill="#f7f4ed" stroke="#d7d5ca" stroke-width="2" rx="12" /><text x="320" y="45" fill="#8c451e" font-size="28" text-anchor="middle">같은 판에서 여러 부가 나온다</text><rect x="47" y="146" width="160" height="155" fill="#e7ddc6" stroke="#8c451e" stroke-width="2" rx="8" /><text x="127" y="209" fill="#202b2c" font-size="32" text-anchor="middle">글 자</text><text x="127" y="258" fill="#202b2c" font-size="32" text-anchor="middle">배 열</text><text x="127" y="356" fill="#202b2c" font-size="26" text-anchor="middle">같은 판</text><line x1="222" y1="225" x2="306" y2="146" stroke="#2d6c68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><rect x="327" y="111" width="261" height="85" fill="#fcfaf5" stroke="#d7d5ca" stroke-width="2" rx="8" /><text x="457" y="165" fill="#202b2c" font-size="28" text-anchor="middle">글 자  배 열</text><line x1="222" y1="225" x2="306" y2="255" stroke="#2d6c68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><rect x="327" y="220" width="261" height="85" fill="#fcfaf5" stroke="#d7d5ca" stroke-width="2" rx="8" /><text x="457" y="274" fill="#202b2c" font-size="28" text-anchor="middle">글 자  배 열</text><line x1="222" y1="225" x2="306" y2="364" stroke="#2d6c68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><rect x="327" y="329" width="261" height="85" fill="#fcfaf5" stroke="#d7d5ca" stroke-width="2" rx="8" /><text x="457" y="383" fill="#202b2c" font-size="28" text-anchor="middle">글 자  배 열</tex