<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
  <title id="title">창백한 푸른 점의 각크기와 픽셀 비교</title>
  <desc id="desc">보이저 1호 협각 카메라의 한 픽셀은 0.000530도이고, 지구 전체 지름의 자체 계산값은 약 0.215픽셀이다. NASA 사진 설명의 밝은 초승달 지구는 0.12픽셀이다. 실제 픽셀 모양이나 원본 영상을 복제하지 않은 비율 설명도다.</desc>
  <rect width="640" height="460" fill="#f7f4ec"/>
  <text x="28" y="42" font-family="sans-serif" font-size="24" font-weight="700" fill="#142b2b">한 픽셀보다 작은 지구를 읽는 세 단계</text>
  <text x="28" y="68" font-family="sans-serif" font-size="14" fill="#526060">설명용 비율 도해 · 실제 사진이나 센서 점확산 모양이 아님</text>
  <rect x="28" y="94" width="584" height="82" rx="10" fill="#e6f1ee" stroke="#246b64" stroke-width="2"/>
  <text x="48" y="122" font-family="sans-serif" font-size="15" font-weight="700" fill="#246b64">1. 카메라 한 칸</text>
  <text x="48" y="151" font-family="sans-serif" font-size="24" font-weight="700" fill="#142b2b">0.424° ÷ 800 = 0.000530°</text>
  <text x="455" y="150" font-family="sans-serif" font-size="16" fill="#142b2b">1.908각초/픽셀</text>
  <rect x="28" y="194" width="584" height="104" rx="10" fill="#eee8f2" stroke="#74436f" stroke-width="2"/>
  <text x="48" y="223" font-family="sans-serif" font-size="15" font-weight="700" fill="#74436f">2. 지구 전체 지름의 자체 계산</text>
  <rect x="50" y="241" width="150" height="36" fill="#ffffff" stroke="#53606a"/>
  <circle cx="67" cy="259" r="8" fill="#3e83a8"/>
  <text x="218" y="265" font-family="sans-serif" font-size="23" font-weight="700" fill="#142b2b">약 0.215픽셀</text>
  <text x="414" y="264" font-family="sans-serif" font-size="14" fill="#526060">12,742km / 64억km</text>
  <rect x="28" y="316" width="584" height="104" rx="10" fill="#f7e8dc" stroke="#b65a2a" stroke-width="2"/>
  <text x="48" y="345" font-family="sans-serif" font-size="15" font-weight="700" fill="#a54d24">3. NASA가 기록한 밝은 초승달 지구</text>
  <rect x="50" y="363" width="150" height="36" fill="#ffffff" stroke="#53606a"/>
  <path d="M65 370a7 7 0 1 0 0 14a5 7 0 1 1 0-14z" fill="#3e83a8"/>
  <text x="218" y="387" font-family="sans-serif" font-size="23" font-weight="700" fill="#142b2b">0.12픽셀</text>
  <text x="398" y="386" font-family="sans-serif" font-size="14" fill="#526060">검출됨 · 표면은 해상되지 않음</text>
  <text x="28" y="448" font-family="sans-serif" font-size="12" fill="#526060">Biz2Lab 자체 도해 · 원자료 수치의 비교 · 확대는 새 세부 정보를 만들지 않음</text>
</svg>