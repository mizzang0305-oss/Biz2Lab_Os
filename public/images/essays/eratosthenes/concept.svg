<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="title description" font-family="Arial, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><title id="title">그림자와 중심각의 연결</title><desc id="description">평행한 햇빛, 구형 지구의 두 지점과 중심각을 연결한 개념도</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6c68" /></marker></defs><rect x="1" y="1" width="638" height="458" fill="#f7f4ed" stroke="#d7d5ca" stroke-width="2" rx="12" /><text x="320" y="45" fill="#8c451e" font-size="28" text-anchor="middle">그림자와 중심각의 연결</text><circle cx="320" cy="286" r="125" fill="#e6ece7" stroke="#2d6c68" stroke-width="2" /><circle cx="320" cy="286" r="3" fill="#2d6c68" stroke="#202b2c" stroke-width="2" /><line x1="320" y1="286" x2="320" y2="161" stroke="#8c451e" stroke-width="3" stroke-linecap="round" /><line x1="320" y1="76" x2="320" y2="151" stroke="#2d6c68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><line x1="320" y1="161" x2="320.0" y2="123.5" stroke="#202b2c" stroke-width="5" stroke-linecap="round" /><line x1="320" y1="286" x2="401" y2="191" stroke="#8c451e" stroke-width="3" stroke-linecap="round" /><line x1="401" y1="106" x2="401" y2="181" stroke="#2d6c68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><line x1="401" y1="191" x2="425.3" y2="162.5" stroke="#202b2c" stroke-width="5" stroke-linecap="round" /><path d="M320 248 A38 38 0 0 1 345 257" stroke="#8c451e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" /><text x="344" y="233" fill="#202b2c" font-size="28" text-anchor="middle">θ</text><line x1="100" y1="115" x2="100" y2="205" stroke="#2d6c68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><line x1="155" y1="115" x2="155" y2="205" stroke="#2d6c68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><line x1="210" y