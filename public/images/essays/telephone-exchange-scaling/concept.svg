<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="title desc">
  <title id="title">직접 연결 15개와 교환기 연결 6개의 비교</title>
  <desc id="desc">전화기 여섯 대를 모든 쌍으로 직접 이은 왼쪽의 15개 선과, 가운데 교환기를 통해 여섯 개 가입자선으로 이은 오른쪽 구조를 비교한다. 선 수만 비교한 설명용 모형이다.</desc>
  <rect width="640" height="460" rx="28" fill="#f7f3ea"/>
  <text x="160" y="42" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#18323a">모든 쌍을 직접 연결</text>
  <text x="480" y="42" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700" fill="#18323a">중앙 교환으로 연결</text>
  <line x1="320" y1="64" x2="320" y2="380" stroke="#c8bfae" stroke-width="2"/>
  <g stroke="#7c8f93" stroke-width="2.5" opacity="0.85">
    <line x1="160" y1="85" x2="247" y2="135"/><line x1="160" y1="85" x2="247" y2="235"/><line x1="160" y1="85" x2="160" y2="285"/><line x1="160" y1="85" x2="73" y2="235"/><line x1="160" y1="85" x2="73" y2="135"/>
    <line x1="247" y1="135" x2="247" y2="235"/><line x1="247" y1="135" x2="160" y2="285"/><line x1="247" y1="135" x2="73" y2="235"/><line x1="247" y1="135" x2="73" y2="135"/>
    <line x1="247" y1="235" x2="160" y2="285"/><line x1="247" y1="235" x2="73" y2="235"/><line x1="247" y1="235" x2="73" y2="135"/>
    <line x1="160" y1="285" x2="73" y2="235"/><line x1="160" y1="285" x2="73" y2="135"/>
    <line x1="73" y1="235" x2="73" y2="135"/>
  </g>
  <g stroke="#2a7d78" stroke-width="4">
    <line x1="480" y1="185" x2="480" y2="85"/><line x1="480" y1="185" x2="567" y2="135"/><line x1="480" y1="185" x2="567" y2="235"/><line x1="480" y1="185" x2="480" y2="285"/><line x1="480" y1="185" x2="393" y2="235"/><line x1="480" y1="185" x2="393" y2="135"/>
  </g>
  <g fill="#fff" stroke="#18323a" stroke-width="2.5">
    <circle cx="160" cy="85" r="18"/><circle cx="247" cy="135" r="18"/><circle cx="247" cy="235" r="18"/><circle cx="160" cy="285" r="18"/><circle cx="73" cy="235" r="18"/><circle cx="73" cy="135" r="18"/>
    <circle cx="480" cy="85" r="18"/><circle cx="567" cy="135" r="18"/><circle cx="567" cy="235" r="18"/><circle cx="480" cy="285" r="18"/><circle cx="393" cy="235" r="18"/><circle cx="393" cy="135" r="18"/>
  </g>
  <g font-family="sans-serif" font-size="14" font-weight="700" fill="#18323a" text-anchor="middle" dominant-baseline="central">
    <text x="160" y="85">A</text><text x="247" y="135">B</text><text x="247" y="235">C</text><text x="160" y="285">D</text><text x="73" y="235">E</text><text x="73" y="135">F</text>
    <text x="480" y="85">A</text><text x="567" y="135">B</text><text x="567" y="235">C</text><text x="480" y="285">D</text><text x="393" y="235">E</text><text x="393" y="135">F</text>
  </g>
  <circle cx="480" cy="185" r="34" fill="#f4b860" stroke="#9a5a17" stroke-width="3"/>
  <text x="480" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#4d2d0c">교환기</text>
  <text x="480" y="198" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#4d2d0c">필요한 쌍 선택</text>
  <rect x="69" y="327" width="182" height="44" rx="12" fill="#e7eceb"/>
  <text x="160" y="354" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#18323a">6×5÷2 = 15개</text>
  <rect x="389" y="327" width="182" height="44" rx="12" fill="#dff1ed"/>
  <text x="480" y="354" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#18323a">가입자선 6개</text>
  <text x="320" y="411" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#4f5f63">선 수만 비교한 설명용 모형 · 실제 교환대 내부 배선과 동시 통화 용량은 별도</text>
</svg>
