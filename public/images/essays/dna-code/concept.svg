<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="title description" font-family="Arial, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><title id="title">염기쌍과 코돈은 다른 규칙</title><desc id="description">DNA의 A와 T, G와 C 염기쌍을 RNA의 세 염기 단위 읽기와 구분한 그림</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6c68" /></marker></defs><rect x="1" y="1" width="638" height="458" fill="#f7f4ed" stroke="#d7d5ca" stroke-width="2" rx="12" /><text x="320" y="45" fill="#8c451e" font-size="28" text-anchor="middle">염기쌍과 코돈은 다른 규칙</text><circle cx="102" cy="132" r="20" fill="#e6ece7" stroke="#2d6c68" stroke-width="2" /><circle cx="224" cy="132" r="20" fill="#e7ddc6" stroke="#8c451e" stroke-width="2" /><line x1="126" y1="132" x2="200" y2="132" stroke="#d7d5ca" stroke-width="3" stroke-linecap="round" /><text x="102" y="141" fill="#202b2c" font-size="25" text-anchor="middle">A</text><text x="224" y="141" fill="#202b2c" font-size="25" text-anchor="middle">T</text><circle cx="102" cy="193" r="20" fill="#e6ece7" stroke="#2d6c68" stroke-width="2" /><circle cx="224" cy="193" r="20" fill="#e7ddc6" stroke="#8c451e" stroke-width="2" /><line x1="126" y1="193" x2="200" y2="193" stroke="#d7d5ca" stroke-width="3" stroke-linecap="round" /><text x="102" y="202" fill="#202b2c" font-size="25" text-anchor="middle">G</text><text x="224" y="202" fill="#202b2c" font-size="25" text-anchor="middle">C</text><circle cx="102" cy="254" r="20" fill="#e6ece7" stroke="#2d6c68" stroke-width="2" /><circle cx="224" cy="254" r="20" fill="#e7ddc6" stroke="#8c451e" stroke-width="2" /><line x1="126" y1="254" x2="200" y2="254" stroke="#d7d5ca" stroke-width="3" stroke-linecap="round" /><text x="102" y="263" fill="#202b2c" font-size="25" text-anchor="middle">T</text><text x="224" y="263" fill="#202b2c" font-size="25" text-anchor="middle">A</text><circle cx="102" cy="315" r="20" fill="#e6ece7" stroke="#2d6c68" stroke-width="2" /><circle cx="224" cy="315" r="20" fill="#e7ddc6" stroke="#8c451e" stroke-width="2" /><line x1="126" y1="315" x2="200" y2="315" stroke="#d7d5ca" stroke-width="3" stroke-linecap="round" /><text x="102" y="324" fill="#202b2c" font-size="25" text-anchor="middle">C</text><text x="224" y="324" fill="#202b2c" font-size="25" text-anchor="middle">G</text><text x="163" y="415" fill="#202b2c" font-size="26" text-anchor="middle">DNA 염기쌍</text><text x="459" y="119" fill="#202b2c" font-size="27" text-anchor="middle">RNA 서열 읽기</text><rect x="360" y="173" width="55" height="63" fill="#eeece3" stroke="#d7d5ca" stroke-width="2" rx="8" /><text x="387.5" y="214.5" fill="#202b2c" font-size="20" text-anchor="middle">염기</text><rect x="422" y="173" width="55" height="63" fill="#eeece3" stroke="#d7d5ca" stroke-width="2" rx="8" /><text x="449.5" y="214.5" fill="#202b2c" font-size="20" text-anchor="middle">염기</text><rect x="484" y="173" width="55" height="63" fill="#eeece3" stroke="#d7d5ca" stroke-width="2" rx="8" /><text x="511.5" y="214.5" fill="#202b2c" font-size="20" text-anchor="middle">염기</text><path d="M355 247 V260 H551 V247" fill="none" stroke="#2d6c68" stroke-width="3" /><text x="453" y="302" fill="#202b2c" font-size="26" text-anchor="middle">세 염기 = 코돈</text><line x1="453" y1="320" x2="453" y2="353" stroke="#2d6c68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><text x="453" y="395" fill="#202b2c" font-size="26" text-anchor="middle">아미노산 / 종결</text></svg>