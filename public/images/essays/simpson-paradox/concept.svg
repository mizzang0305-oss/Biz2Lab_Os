<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="simpson-title simpson-desc">
  <title id="simpson-title">팀별 완료율과 전체 완료율이 엇갈리는 이유</title>
  <desc id="simpson-desc">두 달 모두 접수 100건이며 막대의 전체 폭은 같습니다. 접수 후 2영업일 안의 완료는 단색, 미완료는 빗금으로 표시했습니다. 4월 A팀은 80건 중 완료 72건과 미완료 8건으로 완료율 90%, B팀은 20건 중 완료 8건과 미완료 12건으로 완료율 40%입니다. 전체는 80건 완료로 80%입니다. 5월 A팀은 20건 중 완료 19건과 미완료 1건으로 완료율 95%, B팀은 80건 중 완료 40건과 미완료 40건으로 완료율 50%입니다. 전체는 59건 완료로 59%입니다. B팀의 접수 비중이 20%에서 80%로 바뀌었습니다. 설명용 가상 자료이며 실제 운영 실적이 아닙니다. 같은 수치는 본문 표에서도 읽을 수 있습니다.</desc>
  <rect width="640" height="460" rx="12" fill="#f8f6ef"/>
  <g font-family="'Noto Sans KR', 'Noto Sans CJK KR', 'Malgun Gothic', sans-serif" fill="#202923">
    <text x="28" y="37" font-size="23" font-weight="700">완료율이 오른 두 팀, 내려간 전체</text>
    <text x="28" y="62" font-size="13" fill="#505b53">설명용 가상 자료 · 각 달 접수 100건 · 접수 후 2영업일 기준</text>

    <g font-size="13">
      <rect x="28" y="79" width="14" height="14" fill="#1e5b50"/>
      <text x="49" y="91">A팀</text>
      <rect x="101" y="79" width="14" height="14" fill="#713c61"/>
      <text x="122" y="91">B팀</text>
      <rect x="177" y="79" width="17" height="14" fill="#f0eee7" stroke="#555b57"/>
      <path d="M177.00 85.00L183.00 79.00M177.00 91.00L189.00 79.00M194.00 80.00L181.00 93.00M194.00 86.00L187.00 93.00M194.00 92.00L193.00 93.00" fill="none" stroke="#555b57" stroke-width="1" aria-hidden="true"/>
      <text x="201" y="91">빗금 = 기한 내 미완료</text>
      <text x="608" y="91" text-anchor="end" fill="#505b53">막대 폭 = 접수 건수</text>
    </g>

