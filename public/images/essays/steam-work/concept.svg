<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="title description" font-family="Arial, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><title id="title">뜨거운 실린더와 분리 응축기</title><desc id="description">실린더와 별도의 응축기를 연결하고 뜨거운 부분과 차가운 부분을 구분한 그림</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6c68" /></marker></defs><rect x="1" y="1" width="638" height="458" fill="#f7f4ed" stroke="#d7d5ca" stroke-width="2" rx="12" /><text x="320" y="45" fill="#8c451e" font-size="28" text-anchor="middle">뜨거운 실린더와 분리 응축기</text><rect x="70" y="110" width="181" height="207" fill="#ead8c9" stroke="#8c451e" stroke-width="2" rx="8" /><line x1="89" y1="188" x2="232" y2="188" stroke="#202b2c" stroke-width="7" stroke-linecap="round" /><line x1="160" y1="188" x2="160" y2="93" stroke="#202b2c" stroke-width="5" stroke-linecap="round" /><rect x="398" y="201" width="167" height="148" fill="#dbe7e5" stroke="#2d6c68" stroke-width="2" rx="8" /><path d="M251 284 H328 V233 H391" stroke="#2d6c68" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><text x="160" y="375" fill="#202b2c" font-size="29" text-anchor="middle">실린더</text><text x="483" y="394" fill="#202b2c" font-size="29" text-anchor="middle">별도 응축기</text><text x="160" y="426" fill="#202b2c" font-size="24" text-anchor="middle">뜨거운 부분</text><text x="483" y="432" fill="#202b2c" font-size="24" text-anchor="middle">차가운 부분</text></svg>