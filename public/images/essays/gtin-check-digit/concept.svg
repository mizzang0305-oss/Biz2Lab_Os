<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="t d"><title id="t">자리바꿈 뒤에도 나머지가 0인 두 합</title><desc id="d">끝 세 자리 161은 1+18+1=20, 611은 6+3+1=10이다. 두 합을 10으로 나눈 나머지는 모두 0이다.</desc><rect width="640" height="460" fill="#faf6ee"/><g font-family="sans-serif" fill="#182d33"><text x="42" y="60" font-size="28">끝 세 자리만 비교하기</text><text x="42" y="105" font-size="20">앞 열 자리는 모두 0  ·  가중치 1, 3, 1</text><rect x="32" y="132" width="576" height="88" fill="#e1efea"/><text x="52" y="188" font-size="32">161</text><text x="170" y="188" font-size="28">1 + 3 × 6 + 1 = 20</text><rect x="32" y="242" width="576" height="88" fill="#f1e6d4"/><text x="52" y="298" font-size="32">611</text><text x="170" y="298" font-size="28">6 + 3 × 1 + 1 = 10</text><text x="42" y="390" font-size="22">20과 10 모두 나머지 0 → 둘 다 통과</text></g></svg>
