<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="title description" font-family="Arial, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><title id="title">투영이 바꾸는 격자의 간격</title><desc id="description">위도가 높아질수록 세로 간격이 늘어나는 메르카토르 격자의 개념도</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6c68" /></marker></defs><rect x="1" y="1" width="638" height="458" fill="#f7f4ed" stroke="#d7d5ca" stroke-width="2" rx="12" /><text x="320" y="45" fill="#8c451e" font-size="28" text-anchor="middle">투영이 바꾸는 격자의 간격</text><line x1="135" y1="112" x2="135" y2="342" stroke="#2d6c68" stroke-width="2" stroke-linecap="round" /><line x1="228" y1="112" x2="228" y2="342" stroke="#2d6c68" stroke-width="2" stroke-linecap="round" /><line x1="321" y1="112" x2="321" y2="342" stroke="#2d6c68" stroke-width="2" stroke-linecap="round" /><line x1="414" y1="112" x2="414" y2="342" stroke="#2d6c68" stroke-width="2" stroke-linecap="round" /><line x1="507" y1="112" x2="507" y2="342" stroke="#2d6c68" stroke-width="2" stroke-linecap="round" /><line x1="135" y1="112" x2="507" y2="112" stroke="#2d6c68" stroke-width="2" stroke-linecap="round" /><line x1="135" y1="185" x2="507" y2="185" stroke="#2d6c68" stroke-width="2" stroke-linecap="round" /><line x1="135" y1="231" x2="507" y2="231" stroke="#2d6c68" stroke-width="2" stroke-linecap="round" /><line x1="135" y1="265" x2="507" y2="265" stroke="#2d6c68" stroke-width="2" stroke-linecap="round" /><line x1="135" y1="296" x2="507" y2="296" stroke="#2d6c68" stroke-width="2" stroke-linecap="round" /><line x1="135" y1="342" x2="507" y2="342" stroke="#2d6c68" stroke-width="2" stroke-linecap="round" /><text x="91" y="134" fill="#202b2c" font-size="22" text-anchor="middle">고위도</text><text x="91" y="273" fill="#202b2c" font-size="24" text-anchor="middle">적도</text><text x="320" y="401" fill="#202b2c