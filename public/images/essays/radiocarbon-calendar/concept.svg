<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="title desc"><title id="title">현대 탄소 혼합비와 단순 계산 연대</title><desc id="desc">가상 시료 상대량 0.25에 현대 탄소를 0%, 1%, 5% 섞으면 5730년 반감기 계산값은 각각 11460년, 약 11216년, 약 10305년이다. 달력 보정 연대가 아니다.</desc><rect width="640" height="460" fill="#f5f3ec"/><g font-family="Arial, sans-serif" fill="#163330"><text x="32" y="42" font-size="23" font-weight="bold">현대 탄소 혼합비와 단순 계산 연대</text><text x="32" y="76" font-size="16">H = 5730년 · 혼합 전 f = 0.25 · 가상 계산</text><g font-size="20"><text x="32" y="145">0%</text><text x="32" y="225">1%</text><text x="32" y="305">5%</text></g><g fill="#167467"><rect x="105" y="115" width="458.4" height="40"/><rect x="105" y="195" width="448.626" height="40"/><rect x="105" y="275" width="412.186" height="40"/></g><g fill="white" font-size="20" text-anchor="end"><text x="550" y="142">11460년</text><text x="540" y="222">11216년</text><text x="504" y="302">10305년</text></g><g stroke="#163330"><path d="M105 330 H585"/><path d="M105 330 V337 M345 330 V337 M585 330 V337"/></g><g font-size="16" text-anchor="middle"><text x="105" y="360">0</text><text x="345" y="360">6000</text><text x="585" y="360">12000년</text></g><text x="32" y="400" font-size="17">왼쪽: 최종 탄소 중 현대 성분 비율</text><text x="32" y="427" font-size="17">막대: 붕괴식의 시간 · 달력 보정 연대 아님</text></g></svg>