<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="title description" font-family="Arial, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><title id="title">공기와 먼지의 경로를 나누기</title><desc id="description">백조목의 굽은 부분에 입자가 남고 공기는 배양액 쪽으로 이어지는 경로의 개념도</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6c68" /></marker></defs><rect x="1" y="1" width="638" height="458" fill="#f7f4ed" stroke="#d7d5ca" stroke-width="2" rx="12" /><text x="320" y="45" fill="#8c451e" font-size="28" text-anchor="middle">공기와 먼지의 경로를 나누기</text><path d="M290 220 V167 Q290 120 350 120 Q410 120 410 157 Q410 198 473 198 H520" stroke="#202b2c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M317 220 V164 Q317 145 350 145 Q384 145 384 170 Q384 220 473 220 H520" stroke="#202b2c" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path d="M290 220 C185 252 181 381 297 394 C407 386 416 258 317 220 Z" stroke="#202b2c" stroke-width="4" fill="#fcfaf5" stroke-linecap="round" stroke-linejoin="round" /><path d="M206 335 Q301 358 391 335 L371 374 Q299 410 226 372 Z" stroke="#2d6c68" stroke-width="2" fill="#dbe7e5" stroke-linecap="round" stroke-linejoin="round" /><line x1="557" y1="209" x2="463" y2="209" stroke="#2d6c68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><path d="M469 209 Q420 206 409 176" stroke="#2d6c68" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" /><circle cx="429" cy="214" r="3" fill="#8c451e" stroke="#202b2c" stroke-width="2" /><circle cx="439" cy="213" r="3" fill="#8c451e" stroke="#202b2c" stroke-width="2" /><circle cx="446" cy="215" r="3" fill="#8c451e" stroke="#202b2c" stroke-width="2" /><text x="520" y="119" fill="#202b2c" font-size="30" text-anchor="middle">공기</text><text x="508" y="274" fill="#202b2c" font-size="23" text-anchor="middle">입자가 남는 굽이</text><text x="289" y="435" fill="#202b2c" font-size="29" text-anchor="middle">배양액</text></svg>