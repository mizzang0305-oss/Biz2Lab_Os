<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="title description" font-family="Arial, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><title id="title">발견에서 사용까지 남는 결정</title><desc id="description">관찰과 해석에서 연구 조직과 정책 결정으로 이어지는 서로 다른 단계의 도식</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6c68" /></marker></defs><rect x="1" y="1" width="638" height="458" fill="#f7f4ed" stroke="#d7d5ca" stroke-width="2" rx="12" /><text x="320" y="45" fill="#8c451e" font-size="28" text-anchor="middle">발견에서 사용까지 남는 결정</text><rect x="36" y="160" width="162" height="118" fill="#eeece3" stroke="#d7d5ca" stroke-width="2" rx="8" /><text x="117.0" y="229.0" fill="#202b2c" font-size="26" text-anchor="middle">관찰·해석</text><rect x="67" y="307" width="100" height="77" fill="#fcfaf5" stroke="#d7d5ca" stroke-width="2" rx="8" /><line x1="85" y1="342" x2="149" y2="342" stroke="#678095" stroke-width="3" stroke-linecap="round" /><line x1="85" y1="374" x2="149" y2="374" stroke="#678095" stroke-width="3" stroke-linecap="round" /><line x1="85" y1="406" x2="149" y2="406" stroke="#678095" stroke-width="3" stroke-linecap="round" /><line x1="85" y1="438" x2="149" y2="438" stroke="#678095" stroke-width="3" stroke-linecap="round" /><rect x="239" y="160" width="162" height="118" fill="#eeece3" stroke="#d7d5ca" stroke-width="2" rx="8" /><text x="320.0" y="229.0" fill="#202b2c" font-size="26" text-anchor="middle">연구 조직</text><rect x="270" y="307" width="100" height="77" fill="#fcfaf5" stroke="#d7d5ca" stroke-width="2" rx="8" /><line x1="288" y1="342" x2="352" y2="342" stroke="#678095" stroke-width="3" stroke-linecap="round" /><line x1="288" y1="374" x2="352" y2="374" stroke="#678095" stroke-width="3" stroke-linecap="round" /><line x1="288" y1="406" x2="352" y2="406" stroke="#678095" stroke-width="3" stroke-linecap="round" /><line x1="288" y1="438" x2="352" y2="438" stroke="#678095" stroke-width="3" stroke-linecap="round" /><rect x="442" y="160" width="162" height="118" fill="#eeece3" stroke="#d7d5ca" stroke-width="2" rx="8" /><text x="523.0" y="229.0" fill="#202b2c" font-size="26" text-anchor="middle">정책 결정</text><rect x="473" y="307" width="100" height="77" fill="#fcfaf5" stroke="#d7d5ca" stroke-width="2" rx="8" /><line x1="491" y1="342" x2="555" y2="342" stroke="#678095" stroke-width="3" stroke-linecap="round" /><line x1="491" y1="374" x2="555" y2="374" stroke="#678095" stroke-width="3" stroke-linecap="round" /><line x1="491" y1="406" x2="555" y2="406" stroke="#678095" stroke-width="3" stroke-linecap="round" /><line x1="491" y1="438" x2="555" y2="438" stroke="#678095" stroke-width="3" stroke-linecap="round" /><line x1="203" y1="219" x2="232" y2="219" stroke="#2d6c68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><line x1="405" y1="219" x2="434" y2="219" stroke="#2d6c68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><text x="320" y="115" fill="#202b2c" font-size="25" text-anchor="middle">서로 다른 판단과 책임의 단계</text></svg>