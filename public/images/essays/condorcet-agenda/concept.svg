<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="title desc"><title id="title">세 비교에서 바뀌는 다수 연합</title><desc id="desc">A는 B에 6 대 3, B는 C에 7 대 2, C는 A에 5 대 4로 이긴다. 아홉 명의 고정된 순위로 만든 가상 예이다.</desc><rect width="640" height="460" fill="#f5f3ec"/><g font-family="Arial, sans-serif" fill="#163330"><text x="32" y="42" font-size="23" font-weight="bold">세 비교에서 바뀌는 다수 연합</text><text x="32" y="76" font-size="16">가상 참여자 9명 · 모든 비교에서 선호 고정</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#167467"/></marker></defs><g fill="none" stroke="#167467" stroke-width="4" marker-end="url(#arrow)"><path d="M355 145 L466 303"/><path d="M452 345 L185 345"/><path d="M172 306 L284 145"/></g><g font-size="27" text-anchor="middle"><circle cx="320" cy="120" r="38" fill="#163330"/><circle cx="490" cy="345" r="38" fill="#163330"/><circle cx="150" cy="345" r="38" fill="#163330"/><g fill="white"><text x="320" y="130">A</text><text x="490" y="355">B</text><text x="150" y="355">C</text></g></g><g font-size="23" font-weight="bold"><text x="432" y="220">6 : 3</text><text x="288" y="331">7 : 2</text><text x="140" y="220">5 : 4</text></g><text x="32" y="425" font-size="17">승자 → 패자 · 모두를 이기는 안건은 없음</text></g></svg>