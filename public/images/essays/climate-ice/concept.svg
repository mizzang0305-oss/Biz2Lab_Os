y="350" r="8" fill="#f7f4ed" stroke="#2d6c68" stroke-width="2" /><text x="188" y="433" fill="#202b2c" font-size="26" text-anchor="middle">깊이 방향 ↓</text><rect x="347" y="123" width="236" height="88" fill="#eeece3" stroke="#d7d5ca" stroke-width="2" rx="8" /><text x="465.0" y="177.0" fill="#202b2c" font-size="28" text-anchor="middle">눈이 쌓임</text><rect x="347" y="279" width="236" height="88" fill="#eeece3" stroke="#d7d5ca" stroke-width="2" rx="8" /><text x="465.0" y="333.0" fill="#202b2c" font-size="28" text-anchor="middle">공기가 갇힘</text><line x1="466" y1="217" x2="466" y2="270" stroke="#2d6c68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><text x="466" y="253" fill="#202b2c" font-size="23" text-anchor="middle">서로 다른 시점</text></svg>