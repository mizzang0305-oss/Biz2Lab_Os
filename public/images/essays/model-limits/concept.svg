<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" aria-labelledby="title description" font-family="Arial, Malgun Gothic, Apple SD Gothic Neo, sans-serif"><title id="title">한 예측에서 갈리는 두 결정</title><desc id="description">대기시간 20분이라는 가상 예측을 방문자 안내와 인력 배치의 두 결정으로 나눈 그림</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2d6c68" /></marker></defs><rect x="1" y="1" width="638" height="458" fill="#f7f4ed" stroke="#d7d5ca" stroke-width="2" rx="12" /><text x="320" y="45" fill="#8c451e" font-size="28" text-anchor="middle">한 예측에서 갈리는 두 결정</text><rect x="151" y="103" width="338" height="84" fill="#eeece3" stroke="#d7d5ca" stroke-width="2" rx="8" /><text x="320.0" y="155.0" fill="#202b2c" font-size="31" text-anchor="middle">대기시간 예측 20분</text><line x1="248" y1="195" x2="147" y2="270" stroke="#2d6c68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><line x1="398" y1="195" x2="500" y2="270" stroke="#2d6c68" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" /><rect x="25" y="286" width="248" height="77" fill="#eeece3" stroke="#d7d5ca" stroke-width="2" rx="8" /><text x="149.0" y="334.5" fill="#202b2c" font-size="30" text-anchor="middle">방문자 안내</text><rect x="368" y="286" width="248" height="77" fill="#eeece3" stroke="#d7d5ca" stroke-width="2" rx="8" /><text x="492.0" y="334.5" fill="#202b2c" font-size="30" text-anchor="middle">인력 배치</text><text x="149" y="414" fill="#202b2c" font-size="24" text-anchor="middle">안내의 목적·조건</text><text x="492" y="414" fill="#202b2c" font-size="24" text-anchor="middle">인원·비용·조건</text></svg>